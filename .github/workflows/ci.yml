name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install virtual display for JavaFX tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a bash ./mvnw --batch-mode clean test

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode clean test

      - name: Run tests on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./mvnw --batch-mode clean test

  static-analysis:
    name: PMD baseline (informational)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Generate PMD baseline report
        run: bash ./mvnw --batch-mode test-compile pmd:pmd

      - name: Upload PMD baseline report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pmd-baseline
          path: |
            target/site/pmd.html
            target/pmd.xml
          if-no-files-found: warn
          retention-days: 90
