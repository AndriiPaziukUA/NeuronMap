name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install virtual display for JavaFX tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a bash ./mvnw --batch-mode clean test

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode clean test

      - name: Run tests on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./mvnw --batch-mode clean test

      - name: Upload JaCoCo report for baseline measurement
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 30

  static-analysis:
    name: PMD incremental quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test PMD baseline checker
        run: python3 -m unittest discover --start-directory quality --pattern 'test_*.py'

      - name: Generate PMD XML report
        run: bash ./mvnw --batch-mode test-compile pmd:pmd

      - name: Enforce incremental PMD baseline
        run: python3 quality/check_pmd_baseline.py --baseline quality/pmd-baseline.json --report target/pmd.xml

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pmd-report
          path: target/pmd.xml
          if-no-files-found: warn
          retention-days: 90
